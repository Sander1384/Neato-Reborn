name: Neato Reborn Golden Build Verify

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-c3:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout verifier
        uses: actions/checkout@v7

      - name: Recreate historical OpenNeato build path
        shell: bash
        run: |
          set -euxo pipefail

          GOLDEN="c295660c7ec9bbcfdec55bf6283901f8d328d0a3"
          BUILDROOT="/home/runner/work/OpenNeato/OpenNeato"

          rm -rf /home/runner/work/OpenNeato
          mkdir -p /home/runner/work/OpenNeato

          git clone https://github.com/Sander1384/Neato-Reborn.git "$BUILDROOT"

          cd "$BUILDROOT"
          git checkout "$GOLDEN"

          echo "BUILDROOT=$(pwd)"
          echo "HEAD=$(git rev-parse HEAD)"

          test "$(git rev-parse HEAD)" = "$GOLDEN"

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build frontend in historical path
        working-directory: /home/runner/work/OpenNeato/OpenNeato/frontend
        run: |
          node --version
          npm --version
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install exact PlatformIO
        run: |
          python --version
          pip install -r /home/runner/work/OpenNeato/OpenNeato/.github/platformio-requirements.txt
          pio --version

      - name: Build v0.15 in historical path
        working-directory: /home/runner/work/OpenNeato/OpenNeato
        env:
          FIRMWARE_VERSION: "0.15"
        run: |
          pio run -e c3-release

      - name: Compare against official v0.15
        shell: bash
        run: |
          set -euo pipefail

          BUILT="/home/runner/work/OpenNeato/OpenNeato/.pio/build/c3-release/openneato-esp32-c3-firmware.bin"
          OFFICIAL="/tmp/openneato-official-v0.15.bin"

          curl -L --fail \
            "https://github.com/renjfk/OpenNeato/releases/download/v0.15/openneato-esp32-c3-firmware.bin" \
            -o "$OFFICIAL"

          echo "===== FILE SIZES ====="
          stat --printf="Built:    %s bytes\n" "$BUILT"
          stat --printf="Official: %s bytes\n" "$OFFICIAL"

          echo
          echo "===== SHA256 ====="

          BUILT_HASH="$(sha256sum "$BUILT" | awk '{print $1}')"
          OFFICIAL_HASH="$(sha256sum "$OFFICIAL" | awk '{print $1}')"

          echo "Built:    $BUILT_HASH"
          echo "Official: $OFFICIAL_HASH"

          echo
          echo "===== BUILD PATH STRINGS ====="

          echo "--- Built ---"
          strings "$BUILT" | grep -F "/home/runner/work" | head -20 || true

          echo "--- Official ---"
          strings "$OFFICIAL" | grep -F "/home/runner/work" | head -20 || true

          if cmp -s "$BUILT" "$OFFICIAL"; then
            echo
            echo "GOLDEN BYTE MATCH: PASS"
            exit 0
          fi

          echo
          echo "GOLDEN BYTE MATCH: DIFFERENT"

          echo
          echo "===== FIRST BYTE DIFFERENCES ====="
          cmp -l "$BUILT" "$OFFICIAL" | head -40 || true

          echo "::error::Golden firmware still differs from official v0.15"
          exit 1

      - name: Upload diagnostic firmware
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nr-golden-v0.15-diagnostic
          path: /home/runner/work/OpenNeato/OpenNeato/.pio/build/c3-release/openneato-esp32-c3-firmware.bin